<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SQL query learning lifecycle</title>
  <desc id="desc">A query moves from question to schema inspection, writing, execution, and validation.</desc>
  <rect width="1200" height="420" rx="34" fill="#0f172a"/>
  <text x="70" y="78" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">The professional SQL loop</text>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <g fill="#7c3aed"><rect x="55" y="155" width="190" height="110" rx="18"/><text x="150" y="205" fill="#fff">Question</text><text x="150" y="235" fill="#ddd6fe" font-size="16">What do we need?</text></g>
    <g fill="#0ea5e9"><rect x="285" y="155" width="190" height="110" rx="18"/><text x="380" y="205" fill="#fff">Schema</text><text x="380" y="235" fill="#dbeafe" font-size="16">What exists?</text></g>
    <g fill="#10b981"><rect x="515" y="155" width="190" height="110" rx="18"/><text x="610" y="205" fill="#fff">Query</text><text x="610" y="235" fill="#d1fae5" font-size="16">Write the logic</text></g>
    <g fill="#f59e0b"><rect x="745" y="155" width="190" height="110" rx="18"/><text x="840" y="205" fill="#fff">Run</text><text x="840" y="235" fill="#fef3c7" font-size="16">Inspect output</text></g>
    <g fill="#ec4899"><rect x="975" y="155" width="170" height="110" rx="18"/><text x="1060" y="205" fill="#fff">Refine</text><text x="1060" y="235" fill="#fce7f3" font-size="16">Explain result</text></g>
  </g>
  <g stroke="#cbd5e1" stroke-width="4" fill="none"><path d="M245 210h40M475 210h40M705 210h40M935 210h40"/><path d="M1060 285v70H150v-70"/></g>
  <path d="m275 198 18 12-18 12m230-12 18 12-18 12m230-12 18 12-18 12m230-12 18 12-18 12m-775 58-12 18-12-18" fill="none" stroke="#cbd5e1" stroke-width="4"/>
</svg>
