<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Relational database model</title>
  <desc id="desc">Students and courses connect through an enrollments table.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#312e81" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <text x="70" y="78" fill="#312e81" font-family="Arial, sans-serif" font-size="30" font-weight="700">A relational model connects facts without repeating them</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="150" width="290" height="300" rx="20" fill="#fff" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="455" y="150" width="290" height="300" rx="20" fill="#fff" stroke="#0ea5e9" stroke-width="3"/>
    <rect x="840" y="150" width="290" height="300" rx="20" fill="#fff" stroke="#10b981" stroke-width="3"/>
    <text x="105" y="205" fill="#4c1d95" font-size="25" font-weight="700">students</text>
    <text x="490" y="205" fill="#075985" font-size="25" font-weight="700">enrollments</text>
    <text x="875" y="205" fill="#047857" font-size="25" font-weight="700">courses</text>
    <g fill="#475569" font-size="20">
      <text x="105" y="255">student_id · PK</text><text x="105" y="295">name</text><text x="105" y="335">department</text>
      <text x="490" y="255">student_id · FK</text><text x="490" y="295">course_id · FK</text><text x="490" y="335">grade</text>
      <text x="875" y="255">course_id · PK</text><text x="875" y="295">course_name</text><text x="875" y="335">credits</text>
    </g>
  </g>
  <path d="M360 290h95M745 290h95" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="m440 276 20 14-20 14M825 276l20 14-20 14" fill="none" stroke="#64748b" stroke-width="5"/>
  <text x="70" y="530" fill="#64748b" font-family="Arial, sans-serif" font-size="21">Primary keys identify rows. Foreign keys create relationships. Queries turn those relationships into answers.</text>
</svg>
